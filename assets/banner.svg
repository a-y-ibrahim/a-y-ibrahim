<svg width="854" height="200" viewBox="0 0 854 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abdelrahman Youssef, Full-Stack Developer, AI and MCP Tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="0.45" stop-color="#8B7CF0"/>
      <stop offset="0.75" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#4f46e5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="caretGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#7dd3fc" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4f46e5" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="854" height="200" rx="18"/></clipPath>
  </defs>

  <rect x="0" y="0" width="854" height="200" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="854" height="200" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="854" height="200" rx="18" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="852.5" height="198.5" rx="17.25" fill="none" stroke="#8B7CF0" stroke-opacity="0.22" stroke-width="1.5"/>

  <g clip-path="url(#card)">
    <rect x="0" y="-40" width="854" height="6" fill="#7dd3fc" opacity="0.06">
      <animate attributeName="y" values="-40;236" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="-40" width="854" height="1.5" fill="#a5f3fc" opacity="0.18">
      <animate attributeName="y" values="-38;238" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <circle cx="48" cy="46" r="5" fill="#6D28D9"/>
    <circle cx="66" cy="46" r="5" fill="#4f46e5"/>
    <circle cx="84" cy="46" r="5" fill="#0EA5E9"/>
  </g>

  <text x="48" y="112" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#0EA5E9" fill-opacity="0.85">&gt;_</text>

  <g font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="0.5">
    <text x="98" y="112" fill="#8B7CF0" fill-opacity="0.35">Abdelrahman Youssef</text>
    <text x="98" y="112" fill="#6D28D9" fill-opacity="0.25">Abdelrahman Youssef</text>
    <text x="98" y="112" fill="url(#name)">Abdelrahman Youssef</text>
  </g>

  <g>
    <ellipse cx="626" cy="99" rx="22" ry="27" fill="url(#caretGlow)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    </ellipse>
    <rect x="618" y="82" width="16" height="34" rx="2" fill="#7dd3fc">
      <animate attributeName="opacity" values="1;0.05;1" dur="2.4s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <rect x="98" y="134" width="392" height="34" rx="17" fill="#0b1020" fill-opacity="0.6" stroke="url(#accent)" stroke-opacity="0.7" stroke-width="1.25"/>
    <circle cx="120" cy="151" r="4" fill="#0EA5E9">
      <animate attributeName="fill-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="136" y="156" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="0.4" fill="#c7d2fe">Full-Stack Developer &#183; AI &amp; MCP Tooling</text>
  </g>

  <g>
    <circle cx="770" cy="60" r="3" fill="#7dd3fc" fill-opacity="0.9">
      <animate attributeName="cy" values="60;52;60" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="806" cy="96" r="2.5" fill="#8B7CF0" fill-opacity="0.9">
      <animate attributeName="cy" values="96;104;96" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="140" r="2.5" fill="#0EA5E9" fill-opacity="0.8">
      <animate attributeName="cy" values="140;133;140" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
